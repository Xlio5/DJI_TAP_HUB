<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TUN_NAT_HUB Lceda Bridge</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #172033; }
    button { padding: 8px 12px; margin-right: 8px; }
    pre { background: #f5f7fb; border: 1px solid #d8deea; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>TUN_NAT_HUB Lceda Bridge</h1>
  <button id="health">Health</button>
  <button id="plan">Import Plan</button>
  <pre id="output">Ready.</pre>
  <script>
    const output = document.getElementById("output");
    async function show(path) {
      const response = await fetch(path);
      output.textContent = JSON.stringify(await response.json(), null, 2);
    }
    document.getElementById("health").onclick = () => show("/health");
    document.getElementById("plan").onclick = () => show("/api/projects/tun-nat-hub-v3s-evt/import-plan");
  </script>
</body>
</html>
